[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scan2bim"
dynamic = ["version"]
description = "Pistepilvi → puhdas arkkitehtimalli (IFC/DXF)"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "open3d>=0.19",
    "pye57>=0.4.19",
    "laspy[lazrs]>=2.5",
    "numpy>=1.26,<2.0",
    "scipy>=1.13",
    "opencv-python>=4.9",
    "pydantic>=2.7,<3.0",
    "ezdxf>=1.4",
    "ifcopenshell>=0.8.0",
    "click>=8.1",
    "packaging>=23.0",
    "onnxruntime>=1.18",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
dev = ["pytest>=8.2", "pytest-cov>=5.0"]
build = ["pyinstaller>=6.0", "pillow>=10.0"]

[project.scripts]
scan2bim = "scan2bim.cli:main"

[project.gui-scripts]
scan2bim-gui = "scan2bim.gui.app:run"

[tool.setuptools.dynamic]
version = { attr = "scan2bim._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
